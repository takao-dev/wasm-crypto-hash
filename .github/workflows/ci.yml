name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run build

      - name: Codecov Bundle Analysis
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        env:
          BUNDLE_ANALYZER_UPLOAD_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          npx --yes @codecov/bundle-analyzer ./dist --bundle-name=${{ github.event.repository.name }} || true

      - name: Run test suite (with coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Run test suite
        if: matrix.os != 'ubuntu-latest' || matrix.node-version != '22.x'
        run: npm test

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./coverage/junit.xml
          fail_ci_if_error: false

      - name: Verify package packaging integrity
        run: npm pack --dry-run
